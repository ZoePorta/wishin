name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  # Job 1: Unit Tests (Fast, no network required)
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      # ADR 029: only runs when the frozen install failed. A stale lockfile is
      # regenerated (and pushed back when the branch is ours); any other install
      # error (e.g. a broken postinstall) fails here and fails the job.
      - name: Auto-fix lockfile
        if: steps.install.outcome == 'failure'
        env:
          CAN_PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          pnpm install --no-frozen-lockfile
          if [ "$CAN_PUSH" = "true" ] && ! git diff --quiet -- pnpm-lock.yaml; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm-lock.yaml [skip ci]"
            git push
          fi
      - run: pnpm test # This should only run *.spec.ts [cite: 2026-01-30]

  # Job 2: Integration Tests (Slow, requires Appwrite)
  integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run integration if build succeeds to save resources [cite: 2026-01-26]
    needs: unit_tests
    # Release gate only: PRs into develop run unit tests alone to save Appwrite quota
    if: github.event_name == 'push' || github.base_ref == 'main'
    env:
      EXPO_PUBLIC_APPWRITE_ENDPOINT: ${{ vars.EXPO_PUBLIC_APPWRITE_ENDPOINT }}
      EXPO_PUBLIC_APPWRITE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_PROJECT_ID }}
      EXPO_PUBLIC_APPWRITE_DATABASE_ID: ${{ vars.EXPO_PUBLIC_APPWRITE_DATABASE_ID }}
      EXPO_PUBLIC_DB_PREFIX: test
      APPWRITE_API_SECRET: ${{ secrets.APPWRITE_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
        continue-on-error: true
      # ADR 029: only runs when the frozen install failed. A stale lockfile is
      # regenerated (and pushed back when the branch is ours); any other install
      # error (e.g. a broken postinstall) fails here and fails the job.
      - name: Auto-fix lockfile
        if: steps.install.outcome == 'failure'
        env:
          CAN_PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          pnpm install --no-frozen-lockfile
          if [ "$CAN_PUSH" = "true" ] && ! git diff --quiet -- pnpm-lock.yaml; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm-lock.yaml [skip ci]"
            git push
          fi
      # Critical step: Provision the isolated test environment [cite: 2026-01-30]
      - name: Provision Test DB
        run: pnpm run db:provision:test
      - name: Run Integration Tests
        run: pnpm run test:integration
