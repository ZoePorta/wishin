<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Declare the UI language before first paint so browsers (e.g. Safari) don't offer
      // to translate a page that is already in the user's language. Mirrors
      // resolveLanguage() in src/i18n; useDeviceLanguageSync keeps it updated afterwards.
      (function () {
        var supported = ["en", "es"];
        var preferred = navigator.languages || [navigator.language];
        for (var i = 0; i < preferred.length; i++) {
          var code = String(preferred[i] || "")
            .split("-")[0]
            .toLowerCase();
          if (supported.indexOf(code) !== -1) {
            document.documentElement.lang = code;
            return;
          }
        }
      })();
    </script>
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Wishin</title>
    <meta
      name="description"
      content="Create and share wishlists for any occasion."
    />

    <!-- PWA: installable web app (Android/desktop) and iOS "Add to Home Screen" -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FEF7FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wishin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
